name: Update central news feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2,8,14,20 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: central-news-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh 2. Bundesliga
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python plugins/kicker-interactive-manager/skills/build-kicker-interactive-squad/scripts/refresh_news_snapshot.py \
            --mapping config/news/2-bundesliga.json \
            --output public/v1/news/2-bundesliga.json \
            --provider api_sports

      - name: Refresh 3. Liga
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python plugins/kicker-interactive-manager/skills/build-kicker-interactive-squad/scripts/refresh_news_snapshot.py \
            --mapping config/news/3-liga.json \
            --output public/v1/news/3-liga.json \
            --provider api_sports

      - name: Validate generated snapshots
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          scripts = Path(
              "plugins/kicker-interactive-manager/skills/"
              "build-kicker-interactive-squad/scripts"
          )
          sys.path.insert(0, str(scripts))
          from news_snapshot import load_snapshot

          for path in sorted(Path("public/v1/news").glob("*.json")):
              snapshot = load_snapshot(path)
              print(
                  path,
                  snapshot["competition"],
                  snapshot["season"],
                  len(snapshot["players"]),
              )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
