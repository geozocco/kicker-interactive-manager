name: Update central Kicker data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2,8,14,20 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: central-kicker-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh 2. Bundesliga market
        run: |
          python plugins/kicker-interactive-manager/skills/build-kicker-interactive-squad/scripts/refresh_market_snapshot.py \
            --mapping config/market/2-bundesliga.json \
            --output public/v1/market/2-bundesliga.json

      - name: Refresh 3. Liga market
        run: |
          python plugins/kicker-interactive-manager/skills/build-kicker-interactive-squad/scripts/refresh_market_snapshot.py \
            --mapping config/market/3-liga.json \
            --output public/v1/market/3-liga.json

      - name: Extend longitudinal Kicker history
        run: |
          python plugins/kicker-interactive-manager/skills/build-kicker-interactive-squad/scripts/refresh_kicker_history_snapshot.py \
            --market public/v1/market/2-bundesliga.json \
            --previous https://geozocco.github.io/kicker-interactive-manager/v1/kicker-history/2-bundesliga.json \
            --output public/v1/kicker-history/2-bundesliga.json
          python plugins/kicker-interactive-manager/skills/build-kicker-interactive-squad/scripts/refresh_kicker_history_snapshot.py \
            --market public/v1/market/3-liga.json \
            --previous https://geozocco.github.io/kicker-interactive-manager/v1/kicker-history/3-liga.json \
            --output public/v1/kicker-history/3-liga.json

      - name: Refresh 2. Bundesliga
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_APIKEY }}
        run: |
          python plugins/kicker-interactive-manager/skills/build-kicker-interactive-squad/scripts/refresh_news_snapshot.py \
            --mapping config/news/2-bundesliga.json \
            --role-evidence-config config/quality/2-bundesliga.json \
            --market public/v1/market/2-bundesliga.json \
            --previous-quality https://geozocco.github.io/kicker-interactive-manager/v1/quality/2-bundesliga.json \
            --output public/v1/news/2-bundesliga.json \
            --previous https://geozocco.github.io/kicker-interactive-manager/v1/news/2-bundesliga.json \
            --provider api_sports \
            --optional-provider sportsmonks

      - name: Respect API-Sports minute limit
        run: sleep 65

      - name: Refresh 3. Liga
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_APIKEY }}
        run: |
          python plugins/kicker-interactive-manager/skills/build-kicker-interactive-squad/scripts/refresh_news_snapshot.py \
            --mapping config/news/3-liga.json \
            --role-evidence-config config/quality/3-liga.json \
            --market public/v1/market/3-liga.json \
            --previous-quality https://geozocco.github.io/kicker-interactive-manager/v1/quality/3-liga.json \
            --output public/v1/news/3-liga.json \
            --previous https://geozocco.github.io/kicker-interactive-manager/v1/news/3-liga.json \
            --provider api_sports \
            --optional-provider sportsmonks

      - name: Respect API-Sports minute limit before quality history
        run: sleep 65

      - name: Refresh 2. Bundesliga preseason evidence
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python plugins/kicker-interactive-manager/skills/build-kicker-interactive-squad/scripts/refresh_preseason_snapshot.py \
            --news public/v1/news/2-bundesliga.json \
            --mapping config/preseason/2-bundesliga.json \
            --previous https://geozocco.github.io/kicker-interactive-manager/v1/preseason/2-bundesliga.json \
            --output public/v1/preseason/2-bundesliga.json

      - name: Refresh 3. Liga preseason evidence
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python plugins/kicker-interactive-manager/skills/build-kicker-interactive-squad/scripts/refresh_preseason_snapshot.py \
            --news public/v1/news/3-liga.json \
            --mapping config/preseason/3-liga.json \
            --previous https://geozocco.github.io/kicker-interactive-manager/v1/preseason/3-liga.json \
            --output public/v1/preseason/3-liga.json

      - name: Respect API-Sports minute limit before player histories
        run: sleep 65

      - name: Refresh Transfermarkt history for 2. Bundesliga
        run: |
          python plugins/kicker-interactive-manager/skills/build-kicker-interactive-squad/scripts/refresh_transfermarkt_history.py \
            --market public/v1/market/2-bundesliga.json \
            --mapping config/history/2-bundesliga.json \
            --strengths config/history/competition-strength.json \
            --identity-seed config/history/identities/2-bundesliga.json \
            --performance-seed config/history/performance/2-bundesliga.json.gz \
            --previous https://geozocco.github.io/kicker-interactive-manager/v1/history/2-bundesliga.json \
            --output public/v1/history/2-bundesliga.json

      - name: Refresh Transfermarkt history for 3. Liga
        run: |
          python plugins/kicker-interactive-manager/skills/build-kicker-interactive-squad/scripts/refresh_transfermarkt_history.py \
            --market public/v1/market/3-liga.json \
            --mapping config/history/3-liga.json \
            --strengths config/history/competition-strength.json \
            --identity-seed config/history/identities/3-liga.json \
            --performance-seed config/history/performance/3-liga.json.gz \
            --previous https://geozocco.github.io/kicker-interactive-manager/v1/history/3-liga.json \
            --output public/v1/history/3-liga.json

      - name: Refresh 2. Bundesliga quality pool
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python plugins/kicker-interactive-manager/skills/build-kicker-interactive-squad/scripts/refresh_quality_snapshot.py \
            --market public/v1/market/2-bundesliga.json \
            --news public/v1/news/2-bundesliga.json \
            --preseason public/v1/preseason/2-bundesliga.json \
            --history public/v1/history/2-bundesliga.json \
            --kicker-history public/v1/kicker-history/2-bundesliga.json \
            --previous-quality https://geozocco.github.io/kicker-interactive-manager/v1/quality/2-bundesliga.json \
            --mapping config/quality/2-bundesliga.json \
            --output public/v1/quality/2-bundesliga.json

      - name: Refresh 3. Liga quality pool
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python plugins/kicker-interactive-manager/skills/build-kicker-interactive-squad/scripts/refresh_quality_snapshot.py \
            --market public/v1/market/3-liga.json \
            --news public/v1/news/3-liga.json \
            --preseason public/v1/preseason/3-liga.json \
            --history public/v1/history/3-liga.json \
            --kicker-history public/v1/kicker-history/3-liga.json \
            --previous-quality https://geozocco.github.io/kicker-interactive-manager/v1/quality/3-liga.json \
            --mapping config/quality/3-liga.json \
            --output public/v1/quality/3-liga.json

      - name: Validate generated snapshots
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          scripts = Path(
              "plugins/kicker-interactive-manager/skills/"
              "build-kicker-interactive-squad/scripts"
          )
          sys.path.insert(0, str(scripts))
          from news_snapshot import load_snapshot
          from preseason_snapshot import load_snapshot as load_preseason_snapshot
          from market_snapshot import load_snapshot as load_market_snapshot
          from quality_snapshot import load_snapshot as load_quality_snapshot
          from history_snapshot import load_snapshot as load_history_snapshot
          from kicker_history_snapshot import (
              load_snapshot as load_kicker_history_snapshot,
          )

          for path in sorted(Path("public/v1/news").glob("*.json")):
              snapshot = load_snapshot(path)
              print(
                  path,
                  snapshot["competition"],
                  snapshot["season"],
                  len(snapshot["players"]),
              )
          for path in sorted(Path("public/v1/market").glob("*.json")):
              snapshot = load_market_snapshot(path)
              print(
                  path,
                  snapshot["competition"],
                  snapshot["season"],
                  len(snapshot["players"]),
              )
          for path in sorted(Path("public/v1/preseason").glob("*.json")):
              snapshot = load_preseason_snapshot(path)
              print(
                  path,
                  snapshot["competition"],
                  snapshot["season"],
                  len(snapshot["players"]),
              )
          for path in sorted(Path("public/v1/history").glob("*.json")):
              snapshot = load_history_snapshot(path)
              resolved = sum(
                  item["mapping"]["status"] in {"verified", "probable"}
                  for item in snapshot["players"].values()
              )
              print(
                  path,
                  snapshot["competition"],
                  snapshot["season"],
                  len(snapshot["players"]),
                  resolved,
              )
          for path in sorted(Path("public/v1/kicker-history").glob("*.json")):
              snapshot = load_kicker_history_snapshot(path)
              print(
                  path,
                  snapshot["competition"],
                  snapshot["season"],
                  len(snapshot["players"]),
                  sum(
                      len(item["observations"])
                      for item in snapshot["players"].values()
                  ),
              )
          for path in sorted(Path("public/v1/quality").glob("*.json")):
              snapshot = load_quality_snapshot(path)
              anchors = sum(
                  item["reliable_anchor"]
                  for item in snapshot["annotations"].values()
              )
              print(
                  path,
                  snapshot["competition"],
                  snapshot["season"],
                  len(snapshot["annotations"]),
                  anchors,
              )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
